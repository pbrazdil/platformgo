syntax = "proto3";

package platform.v1;

option go_package = "github.com/upcomers-org/platformgo/contracts/gen/platform/v1;platformv1";

// TradingService is the versioned gRPC mirror of the durable REST command.
service TradingService {
  rpc SubmitOrder(SubmitOrderRequest) returns (OrderAccepted);
}

message SubmitOrderRequest {
  string account_id = 1;
  string intent_id = 2;
  string symbol = 3;
  Side side = 4;
  OrderType type = 5;
  string quantity = 6;
  optional string price = 7;
  optional string trigger_price = 8;
  bool reduce_only = 9;
  TimeInForce time_in_force = 10;
  optional uint32 max_slippage_bps = 11;
  string idempotency_key = 12;
}

message OrderAccepted {
  string order_id = 1;
  string intent_id = 2;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_MARKET = 1;
  ORDER_TYPE_LIMIT = 2;
  ORDER_TYPE_STOP_MARKET = 3;
  ORDER_TYPE_STOP_LIMIT = 4;
  ORDER_TYPE_TAKE_PROFIT_MARKET = 5;
  ORDER_TYPE_TAKE_PROFIT_LIMIT = 6;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
}
