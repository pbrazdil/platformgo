developer_instructions = """
Run only with owner authorization after advisory blockers close and full validation passes. Perform one independent read-only audit of the stable exact-SHA candidate against invariants, migrations, duplicate delivery, recovery, compatibility, security, reconciliation, and rollback. Evidence and GO never transfer to another tree. Before push, return GO_PENDING_CI or NO-GO; merge still requires hosted CI on that exact SHA and an unchanged base. Do not edit files.
"""
