name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: true
      - name: Policy checks
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: make policy
      - name: Complete pinned port inventory
        run: make port-map-complete

  module-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: true
      - name: Module files are tidy
        if: ${{ hashFiles('go.mod') != '' }}
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(git status --porcelain -- go.mod go.sum)"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        if: ${{ hashFiles('go.mod') != '' }}
        run: make fmt-check
      - name: Lint
        if: ${{ hashFiles('go.mod') != '' }}
        run: make lint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19beta2-alpine
        env:
          POSTGRES_DB: platformgo_test
          POSTGRES_PASSWORD: platformgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platformgo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      PLATFORMGO_TEST_POSTGRES_DSN: postgres://postgres:platformgo@127.0.0.1:5432/platformgo_test?sslmode=disable
      PLATFORMGO_TEST_POSTGRES_RESET_AUTHORIZED: YES_I_UNDERSTAND_THIS_DROPS_SCHEMAS
      PLATFORMGO_TEST_NATS_URL: nats://127.0.0.1:4222
      PLATFORMGO_TEST_CENTRIFUGO_URL: http://127.0.0.1:8000
      PLATFORMGO_TEST_CENTRIFUGO_API_KEY: phase3-ci-api-key
      PLATFORMGO_TEST_CENTRIFUGO_TOKEN_SECRET: phase3-ci-token-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Fetch pinned v3 upgrade artifact
        run: |
          v3_revision=2021865d18393bcadf8ed4eae8632295caba2238
          git fetch --no-tags --depth=1 origin "$v3_revision"
          test "$(git rev-parse "$v3_revision^{commit}")" = "$v3_revision"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: true
      - name: Start NATS with JetStream
        run: |
          nats_server_bin="$RUNNER_TEMP/nats-server"
          docker run --detach --name platformgo-nats \
            --publish 127.0.0.1:4222:4222 \
            nats:2.14.3-alpine -js
          docker cp platformgo-nats:/usr/local/bin/nats-server "$nats_server_bin"
          echo "PLATFORMGO_TEST_NATS_SERVER_BIN=$nats_server_bin" >> "$GITHUB_ENV"
          for attempt in {1..20}; do
            if (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs platformgo-nats
          exit 1
      - name: Start Centrifugo
        run: |
          docker run --detach --name platformgo-centrifugo \
            --publish 127.0.0.1:8000:8000 \
            --env CENTRIFUGO_HEALTH_ENABLED=true \
            --env CENTRIFUGO_HTTP_API_KEY="$PLATFORMGO_TEST_CENTRIFUGO_API_KEY" \
            --env CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY="$PLATFORMGO_TEST_CENTRIFUGO_TOKEN_SECRET" \
            --env 'CENTRIFUGO_CHANNEL_NAMESPACES=[{"name":"user","history_size":100,"history_ttl":"300s","force_recovery":true}]' \
            centrifugo/centrifugo@sha256:8ba0c9443dadedc21b20254b3fc76f35c1998b29acc7cdec877ea0c3636c237e \
            centrifugo
          for attempt in {1..20}; do
            if curl --fail --silent "$PLATFORMGO_TEST_CENTRIFUGO_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs platformgo-centrifugo
          exit 1
      - if: ${{ hashFiles('go.mod') != '' }}
        run: go test -p 1 ./... -count=1

  race:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:19beta2-alpine
        env:
          POSTGRES_DB: platformgo_test
          POSTGRES_PASSWORD: platformgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platformgo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      PLATFORMGO_TEST_POSTGRES_DSN: postgres://postgres:platformgo@127.0.0.1:5432/platformgo_test?sslmode=disable
      PLATFORMGO_TEST_POSTGRES_RESET_AUTHORIZED: YES_I_UNDERSTAND_THIS_DROPS_SCHEMAS
      PLATFORMGO_TEST_NATS_URL: nats://127.0.0.1:4222
      PLATFORMGO_TEST_CENTRIFUGO_URL: http://127.0.0.1:8000
      PLATFORMGO_TEST_CENTRIFUGO_API_KEY: phase3-ci-api-key
      PLATFORMGO_TEST_CENTRIFUGO_TOKEN_SECRET: phase3-ci-token-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Fetch pinned v3 upgrade artifact
        run: |
          v3_revision=2021865d18393bcadf8ed4eae8632295caba2238
          git fetch --no-tags --depth=1 origin "$v3_revision"
          test "$(git rev-parse "$v3_revision^{commit}")" = "$v3_revision"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: true
      - name: Start NATS with JetStream
        run: |
          nats_server_bin="$RUNNER_TEMP/nats-server"
          docker run --detach --name platformgo-nats \
            --publish 127.0.0.1:4222:4222 \
            nats:2.14.3-alpine -js
          docker cp platformgo-nats:/usr/local/bin/nats-server "$nats_server_bin"
          echo "PLATFORMGO_TEST_NATS_SERVER_BIN=$nats_server_bin" >> "$GITHUB_ENV"
          for attempt in {1..20}; do
            if (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs platformgo-nats
          exit 1
      - name: Start Centrifugo
        run: |
          docker run --detach --name platformgo-centrifugo \
            --publish 127.0.0.1:8000:8000 \
            --env CENTRIFUGO_HEALTH_ENABLED=true \
            --env CENTRIFUGO_HTTP_API_KEY="$PLATFORMGO_TEST_CENTRIFUGO_API_KEY" \
            --env CENTRIFUGO_CLIENT_TOKEN_HMAC_SECRET_KEY="$PLATFORMGO_TEST_CENTRIFUGO_TOKEN_SECRET" \
            --env 'CENTRIFUGO_CHANNEL_NAMESPACES=[{"name":"user","history_size":100,"history_ttl":"300s","force_recovery":true}]' \
            centrifugo/centrifugo@sha256:8ba0c9443dadedc21b20254b3fc76f35c1998b29acc7cdec877ea0c3636c237e \
            centrifugo
          for attempt in {1..20}; do
            if curl --fail --silent "$PLATFORMGO_TEST_CENTRIFUGO_URL/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs platformgo-centrifugo
          exit 1
      - if: ${{ hashFiles('go.mod') != '' }}
        run: go test -race -p 1 ./... -count=1

  deterministic-repeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: true
      - if: ${{ hashFiles('go.mod') != '' }}
        run: make test-repeat

  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: true
      - if: ${{ hashFiles('go.mod') != '' }}
        run: make vuln
