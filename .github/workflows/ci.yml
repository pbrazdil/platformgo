name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: true
      - name: Policy checks
        env:
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: make policy
      - name: Complete pinned port inventory
        run: make port-map-complete

  module-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: true
      - name: Module files are tidy
        if: ${{ hashFiles('go.mod') != '' }}
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          test -z "$(git status --porcelain -- go.mod go.sum)"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        if: ${{ hashFiles('go.mod') != '' }}
        run: make fmt-check
      - name: Lint
        if: ${{ hashFiles('go.mod') != '' }}
        run: make lint

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: platformgo_test
          POSTGRES_PASSWORD: platformgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platformgo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      PLATFORMGO_TEST_POSTGRES_DSN: postgres://postgres:platformgo@127.0.0.1:5432/platformgo_test?sslmode=disable
      PLATFORMGO_TEST_NATS_URL: nats://127.0.0.1:4222
      PLATFORMGO_TEST_NATS_SERVER_BIN: ${{ runner.temp }}/nats-server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: true
      - name: Start NATS with JetStream
        run: |
          docker run --detach --name platformgo-nats \
            --publish 127.0.0.1:4222:4222 \
            nats:2.14.3-alpine -js
          docker cp platformgo-nats:/nats-server "$PLATFORMGO_TEST_NATS_SERVER_BIN"
          for attempt in {1..20}; do
            if (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs platformgo-nats
          exit 1
      - if: ${{ hashFiles('go.mod') != '' }}
        run: go test -p 1 ./... -count=1

  race:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: platformgo_test
          POSTGRES_PASSWORD: platformgo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platformgo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      PLATFORMGO_TEST_POSTGRES_DSN: postgres://postgres:platformgo@127.0.0.1:5432/platformgo_test?sslmode=disable
      PLATFORMGO_TEST_NATS_URL: nats://127.0.0.1:4222
      PLATFORMGO_TEST_NATS_SERVER_BIN: ${{ runner.temp }}/nats-server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: true
      - name: Start NATS with JetStream
        run: |
          docker run --detach --name platformgo-nats \
            --publish 127.0.0.1:4222:4222 \
            nats:2.14.3-alpine -js
          docker cp platformgo-nats:/nats-server "$PLATFORMGO_TEST_NATS_SERVER_BIN"
          for attempt in {1..20}; do
            if (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs platformgo-nats
          exit 1
      - if: ${{ hashFiles('go.mod') != '' }}
        run: go test -race -p 1 ./... -count=1

  deterministic-repeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: true
      - if: ${{ hashFiles('go.mod') != '' }}
        run: make test-repeat

  vulnerability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: ${{ hashFiles('go.mod') != '' }}
        with:
          go-version-file: go.mod
          cache: true
      - if: ${{ hashFiles('go.mod') != '' }}
        run: make vuln
